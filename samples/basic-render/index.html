<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>FrameForge Sample Animation</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #03050b; color: white; font-family: Inter, system-ui, sans-serif; }
    .orb { width: 180px; height: 180px; border-radius: 999px; background: linear-gradient(135deg, #c026ff, #16f0f0); box-shadow: 0 0 80px rgba(22, 240, 240, 0.45); }
  </style>
</head>
<body>
  <div class="orb" aria-label="Animated gradient orb"></div>
  <script>
    window.__FRAMEFORGE_RENDER_FRAME__ = async ({ frame, fps }) => {
      const progress = frame / (fps * 3);
      document.querySelector('.orb').style.transform = `translateX(${Math.sin(progress * Math.PI * 2) * 240}px) rotate(${progress * 360}deg)`;
    };
  </script>
</body>
</html>
